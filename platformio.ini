; Proiect PlatformIO pentru ceasul cu cronometru (STM32F103C8 / Blue Pill sau PCB-ul din lucrare)
; Se deschide folderul in VS Code cu extensia "PlatformIO IDE", apoi Build / Upload.
[env:ceas]
platform = ststm32
board = bluepill_f103c8
framework = cmsis
upload_protocol = stlink
build_flags = -Os -Wall -Wextra
